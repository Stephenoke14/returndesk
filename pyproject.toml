[project]
name = "returndesk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stephen Oke", email = "stepheoke.uk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
returndesk = "returndesk:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
